name: websyte

x-postgres: &postgres
  POSTGRES_USER: db_user
  POSTGRES_PASSWORD: db_very_big_password
  POSTGRES_DB: db_websyte

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: tools
    command: sh -c "pnpm migrate && pnpm seed && pnpm dev"
    ports:
      - "3000:3000"
    environment:
      <<: *postgres
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      HOSTNAME: 0.0.0.0
      SMTP_USER: smtp_user
      SMTP_PASS: smtp_very_big_password
      SMTP_HOST: mail
      SMTP_PORT: 1025
      SMTP_SECURE: false
      SMTP_FROM: contact@websyte.local
      PORT: 5623
      PUBLIC_SERVER_URL: http://localhost:5623
      CONTACT_EMAIL: diogo@simoes.cc
      PAYLOAD_SECRET: local-development-payload-secret-0001
      CRON_SECRET: local-development-cron-secret-000001
      PREVIEW_SECRET: local-development-preview-secret-0001
    depends_on:
      db:
        condition: service_healthy
      mail:
        condition: service_started
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - next_cache:/app/.next
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - http://localhost:3000/health
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
  mail:
    image: axllent/mailpit:v1.27@sha256:e22dce5b36f93c77082e204a3942fb6b283b7896e057458400a4c88344c3df68
    ports:
      - "1025:1025"
      # Web interface
      - "8025:8025"
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - http://localhost:8025/health
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
  db:
    image: postgres:17@sha256:67f41722b7a8cbdb868a44a4995c846eddfdc2973bccb291ce937dce88ad5675
    environment:
      <<: *postgres
    ports:
      - "5432:5432"
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    volumes:
      - postgres_data:/var/lib/postgresql/data
volumes:
  next_cache:
  node_modules:
  postgres_data:
