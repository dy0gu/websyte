name: "lint & test"

on:
  pull_request:
    branches: [main]
    paths:
      - "web/**"
  push:
    branches: [main]
    paths:
      - "web/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    env:
      COMPOSE_BAKE: "false"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3
        with:
          configFile: .devcontainer/web/devcontainer.json
          push: never
          runCmd: |
            cd web &&
            pnpm run check &&
            pnpm run migrate &&
            pnpm run build &&
            pnpm run test
